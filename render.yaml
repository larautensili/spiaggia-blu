# Blueprint Render.com – Spiaggia Blu
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: Dashboard → New → Blueprint → collega questo repository

services:
  - type: web
    name: spiaggia-blu
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: "echo 'No build step'"
    startCommand: "node server.js"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: JWT_SECRET
        generateValue: true
      # Opzionale: Stripe, SMTP, admin
