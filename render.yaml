      #   sync: false
      # - key: STRIPE_PUBLISHABLE_KEY
      #   sync: false
      # - key: SMTP_HOST
      #   value: smtp.gmail.com
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASS
      #   sync: false
      # - key: ADMIN_NOTIFY_EMAIL
      #   sync: false
